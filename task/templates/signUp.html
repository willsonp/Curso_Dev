<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up</title>
</head>
<body>
    <H1>SignUp</H1>    
    {% if messages %}
        
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        
    {% endif %}

    <form action="/signup/" method="POST">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit">Sign Up</button>

    </form>

</body>
</html>
